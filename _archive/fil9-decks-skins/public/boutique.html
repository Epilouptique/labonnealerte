<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique — La Bonne Alerte</title>
<meta name="description" content="Debloquez des skins cosmetiques avec vos points.">
<!-- Partage social + canonical. Ces balises DOIVENT rester dans le HTML SERVI :
     les crawlers sociaux n'executent pas le JavaScript, une balise ajoutee par
     script n'est jamais vue. og:image est en URL ABSOLUE pour la meme raison. -->
<link rel="canonical" href="https://labonnealerte.fr/boutique">
<meta property="og:type" content="website">
<meta property="og:site_name" content="La Bonne Alerte">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Boutique — La Bonne Alerte">
<meta property="og:description" content="Débloquez des skins cosmétiques avec vos points.">
<meta property="og:url" content="https://labonnealerte.fr/boutique">
<meta property="og:image" content="https://labonnealerte.fr/img/og-default.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="La Bonne Alerte — toutes vos alertes, en un clic.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Boutique — La Bonne Alerte">
<meta name="twitter:description" content="Débloquez des skins cosmétiques avec vos points.">
<meta name="twitter:image" content="https://labonnealerte.fr/img/og-default.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/site.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#fdfaff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body class="loading">

<header>
  <!-- Header injecte par js/header.js (source unique). Ancre minimale. -->
  <div class="wrap nav"></div>
</header>

<!-- Halo de l'écran de chargement commun (visible tant que body.loading). -->
<div class="page-loading" role="status" aria-live="polite"><div class="lba-bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>Chargement…</div>

<main class="wrap shop-main">
  <div id="shop-loading" class="src-loading"><div class="lba-bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>Chargement…</div>

  <div id="shop-anon" class="decks-anon" hidden>
    <h1 class="page-title">La <span class="hl">boutique</span></h1>
    <p class="src-desc">Connectez-vous pour débloquer des skins cosmétiques avec vos points.</p>
    <a class="coll-adopt" href="/connexion">Se connecter</a>
  </div>

  <section id="shop-view" hidden>
    <h1 class="page-title">La <span class="hl">boutique</span></h1>
    <p class="src-desc">Des skins purement cosmétiques, débloqués avec les points gagnés sur le site. Jamais d'argent réel.</p>
    <div class="shop-balance">Votre solde : <strong id="shop-balance">0</strong> points</div>
    <div id="shop-msg" class="coll-adopt-msg" role="status" hidden></div>

    <section id="shop-sec-dashboard" hidden>
      <h2 class="shop-h2">Skins de cartes</h2>
      <div id="shop-grid" class="shop-grid"></div>
    </section>

    <section id="shop-sec-deck" hidden>
      <h2 class="shop-h2">Skins de decks</h2>
      <div id="shop-grid-deck" class="shop-grid"></div>
    </section>
  </section>
</main>

<!--FOOTER-->

<script src="/js/page-loading.js"></script>
<script src="/js/session.js"></script>
<!-- Apercu des skins de DECK : vraie tuile-deck (pile de 3 cartes + ruban), donc les
     memes dependances que /favoris — categories.js + cards.js alimentent LBADeckStack. -->
<script src="/js/categories.js"></script>
<script src="/js/cards.js"></script>
<script src="/js/deck-motifs.js"></script>
<script src="/js/deck-stack.js"></script>
<script src="/js/boutique.js"></script>
<script src="/js/hero-letters.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/header.js"></script>
<script src="/js/pwa.js"></script>
</body>
</html>
