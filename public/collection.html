<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESC}}">
<meta property="og:url" content="{{OG_URL}}">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/site.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#fdfaff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body class="loading">

<header>
  <!-- Header injecte par js/header.js (source unique). Ancre minimale. -->
  <div class="wrap nav"></div>
</header>

<!-- Halo de l'écran de chargement commun (visible tant que body.loading). -->
<div class="page-loading" role="status" aria-live="polite"><div class="lba-bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>Chargement…</div>

<main class="wrap coll-main">
  <div id="coll-loading" class="src-loading"><div class="lba-bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>Chargement…</div>

  <section id="coll-view" hidden>
    <div class="coll-head">
      <a class="src-back" href="/#alertes" aria-label="Revenir à ma collection" title="Ma collection">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 5 5v3"/></svg>
      </a>
      <h1 id="coll-name" class="page-title" data-hero-done="1"></h1>
      <!-- Meme mise en page que le detail d'un deck (/mes-decks) : titre pleine largeur,
           puis rangee [pile a gauche | corps a droite]. Classes REUTILISEES telles quelles. -->
      <div class="deck-detail-layout">
        <span id="coll-emoji" class="coll-emoji" aria-hidden="true"></span>
        <div class="deck-detail-body">
          <p id="coll-desc" class="src-desc"></p>
          <div class="coll-meta">
            <span id="coll-count"></span>
            <span id="coll-likes" class="coll-likes"></span>
          </div>
          <div class="coll-actions">
            <button id="coll-adopt" class="coll-adopt" type="button">Adopter ce deck</button>
            <button id="coll-share" class="share-btn share-btn-lg" type="button">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
              <span class="share-label">Partager</span>
            </button>
          </div>
          <div id="coll-adopt-msg" class="coll-adopt-msg" hidden></div>
          <div id="coll-share-grid" class="share-face-grid coll-share-grid" hidden></div>
        </div>
      </div>
    </div>

    <div class="grid" id="coll-grid"></div>
  </section>

  <div id="coll-error" class="src-error" hidden>Collection introuvable.</div>
</main>

<footer>
  La Bonne Alerte — gratuit, open-source (MIT), sans spam, rien de caché.<br>
  <a href="/">Kiosque</a> · <a href="/a-propos">À propos</a> · <a href="/soutenir">Nous soutenir</a> · <a href="/mentions-legales">Mentions légales</a> · <a href="/confidentialite">Confidentialité</a> · <a href="/proposer">Espace développeur</a>
</footer>

<script src="/js/page-loading.js"></script>
<script src="/js/session.js"></script>
<script src="/js/categories.js"></script>
<script src="/js/cards.js"></script>
<script src="/js/share.js"></script>
<script src="/js/site.js"></script>
<script src="/js/deck-motifs.js"></script>
<script src="/js/deck-stack.js"></script>
<script src="/js/collection-page.js"></script>
<script src="/js/deck-add.js"></script>
<script src="/js/user-task-form.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/header.js"></script>
<script src="/js/pwa.js"></script>
</body>
</html>
