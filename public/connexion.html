<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — La Bonne Alerte</title>
<meta name="description" content="Recevez un lien d'accès par email pour gérer vos alertes. Sans compte, sans mot de passe.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/site.css">
<style>
/* --- page « Connexion » : carte centrée verticalement --- */
.cx-main {
  min-height: calc(100vh - 64px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 20px 72px; gap: 22px;
}
.cx-logo {
  display: flex; align-items: baseline; font-weight: 800; font-size: 24px;
  letter-spacing: -0.5px; color: var(--ink); text-decoration: none;
}
.cx-logo .a { color: var(--amber); padding-right: 2px; }
.cx-logo .fr { padding-left: 2px; color: var(--muted); font-weight: 700; }
.cx-logo .bang { position: relative; width: 11px; margin-left: 3px; }
.cx-logo .bar { position: absolute; top: 2px; left: 1px; width: 5px; height: 14px; border-radius: 3px; background: var(--amber); }
.cx-logo .dot { position: absolute; top: 20px; left: 1px; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.cx-logo .dot::after { content: ""; position: absolute; inset: -1px; border-radius: 50%; border: 1.5px solid var(--green); animation: ping 2s ease-out infinite; }

.cx-card {
  width: 100%; max-width: 400px; background: var(--surface);
  border-radius: 24px; padding: 34px 30px;
  box-shadow: 0 4px 24px rgba(30, 20, 50, .10), 0 1px 3px rgba(30, 20, 50, .08);
  text-align: center;
}
.cx-card h1 { font-size: 23px; font-weight: 800; letter-spacing: -0.02em; }
.cx-card .sub { color: var(--muted); font-size: 14.5px; margin: 10px 0 24px; line-height: 1.5; }
.cx-form { display: grid; gap: 12px; }
.cx-form input {
  width: 100%; border: 1.5px solid color-mix(in srgb, var(--ink) 26%, transparent);
  background: transparent; border-radius: 999px; padding: 13px 18px;
  font: inherit; font-size: 15px; color: var(--ink); text-align: center;
}
.cx-form input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-color: transparent; }
.cx-form button {
  width: 100%; border: none; background: var(--amber); color: #fff; font-weight: 700;
  font-size: 15px; border-radius: 999px; padding: 14px 0; cursor: pointer; font-family: inherit;
  box-shadow: 0 1px 3px rgba(30, 20, 50, .2); transition: background .15s;
}
.cx-form button:hover { background: color-mix(in srgb, var(--amber) 88%, #000); }
.cx-form button:disabled { opacity: .6; cursor: default; }

.cx-expired {
  margin-bottom: 18px; background: var(--amber-soft); color: var(--amber); font-weight: 600;
  border-radius: 12px; padding: 11px 14px; font-size: 13.5px;
}
/* État de succès soigné (icône + message). */
.cx-success { display: none; }
.cx-card.sent .cx-form, .cx-card.sent .sub { display: none; }
.cx-card.sent .cx-success { display: block; }
.cx-success .icon { font-size: 40px; line-height: 1; }
.cx-success h2 { font-size: 18px; font-weight: 800; margin: 14px 0 8px; }
.cx-success p { color: var(--muted); font-size: 14px; line-height: 1.55; }

.cx-back { color: var(--muted); font-size: 13.5px; text-decoration: none; }
.cx-back:hover { color: var(--ink); }
.cx-loading { color: var(--muted); }
</style>
</head>
<body>

<main class="cx-main">
  <a class="cx-logo" href="/">labonne<span class="a">alerte</span><span class="bang"><span class="bar"></span><span class="dot"></span></span><span class="fr">fr</span></a>

  <div class="cx-loading" id="cx-loading">Chargement…</div>

  <section id="cx-view" hidden>
    <div class="cx-card" id="cx-card">
      <div class="cx-expired" id="cx-expired" hidden>Lien expiré, redemandez un accès.</div>

      <h1>Gérer mes alertes</h1>
      <p class="sub">Recevez un lien d'accès par email — pas de mot de passe.</p>

      <form class="cx-form" id="cx-form">
        <input type="email" name="email" required placeholder="votre@email.fr" aria-label="Adresse email">
        <button type="submit" id="cx-btn">Recevoir mon lien d'accès</button>
      </form>

      <div class="cx-success" id="cx-success" aria-live="polite">
        <div class="icon">✉️</div>
        <h2>C'est envoyé&nbsp;!</h2>
        <p id="cx-success-text">Si cet email est inscrit, un lien d'accès vient de lui être envoyé. Pensez à vérifier vos spams.</p>
      </div>
    </div>
  </section>

  <a class="cx-back" href="/">← Retour au kiosque</a>
</main>

<script src="/js/session.js"></script>
<script src="/js/myalerts.js"></script>
</body>
</html>
