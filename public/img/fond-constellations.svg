<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 1200 600"
   preserveAspectRatio="xMidYMax slice"
   aria-hidden="true"
   version="1.1"
   id="svg22"
   sodipodi:docname="fond-constellations.svg"
   inkscape:version="1.4.2 (f4327f4, 2025-05-13)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview22"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.345"
     inkscape:cx="600"
     inkscape:cy="122.30483"
     inkscape:window-width="1920"
     inkscape:window-height="1009"
     inkscape:window-x="1912"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg22" />
  <!--
    Fond constellations et montagnes, La Bonne Alerte.
    Etoiles : memes points que le fond pointille (rayon ~1.4), violet discret.
    Liens : traits fins violets, opacite faible, pour s'incruster dans le motif de points.
    Signal : la derniere etoile de la constellation de droite est verte et "ping".
    Montagnes : silhouette Hautes-Alpes en bas, tres legere.
    Couleurs codees en dur (un SVG en background-image ne lit pas les variables CSS).
    Version claire ; dupliquer avec les valeurs sombres si besoin (voir CSS fourni).
  -->
  <defs
     id="defs1">
    <style
       id="style1">
      .star { fill: rgba(120,95,175,.45); }
      .link { stroke: rgba(120,95,175,.22); stroke-width: 1; fill: none; stroke-linecap: round; }
      .mtn  { fill: rgba(120,95,175,.07); }
      .mtn2 { fill: rgba(120,95,175,.045); }
      .signal { fill: #16a34a; }
      .ring { fill: none; stroke: #16a34a; stroke-width: 1.5; transform-origin: 1052px 118px; animation: ping 2.4s ease-out infinite; }
      @keyframes ping {
        0%   { transform: scale(1);   opacity: .8; }
        100% { transform: scale(3.2); opacity: 0;  }
      }
      @media (prefers-reduced-motion: reduce) { .ring { animation: none; opacity: 0; } }
    </style>
  </defs>
  <!-- Constellation 1 : « la petite balise » (gauche) -->
  <polyline
     class="link"
     points="120,180 175,140 250,165 290,110 360,130"
     id="polyline1" />
  <circle
     class="star"
     cx="120"
     cy="180"
     r="1.6"
     id="circle1" />
  <circle
     class="star"
     cx="175"
     cy="140"
     r="1.4"
     id="circle2" />
  <circle
     class="star"
     cx="250"
     cy="165"
     r="1.8"
     id="circle3" />
  <circle
     class="star"
     cx="290"
     cy="110"
     r="1.4"
     id="circle4" />
  <circle
     class="star"
     cx="360"
     cy="130"
     r="1.6"
     id="circle5" />
  <!-- Constellation 2 : « le dahu » (centre haut) -->
  <!-- Constellation 3 : « le signal » (droite) — se termine sur l'étoile verte -->
  <polyline
     class="link"
     points="830,220 890,180 940,205 995,150 1052,118"
     id="polyline10" />
  <circle
     class="star"
     cx="830"
     cy="220"
     r="1.5"
     id="circle11" />
  <circle
     class="star"
     cx="890"
     cy="180"
     r="1.7"
     id="circle12" />
  <circle
     class="star"
     cx="940"
     cy="205"
     r="1.4"
     id="circle13" />
  <circle
     class="star"
     cx="995"
     cy="150"
     r="1.6"
     id="circle14" />
  <!-- Dernière étoile : le point vert du logo, avec son anneau ping -->
  <circle
     class="signal"
     cx="1052"
     cy="118"
     r="3"
     id="circle15" />
  <circle
     class="ring"
     cx="1052"
     cy="118"
     r="4"
     id="circle16" />
  <!-- Quelques étoiles libres pour fondre dans le motif pointillé -->
  <circle
     class="star"
     cx="80"
     cy="90"
     r="1.3"
     id="circle19" />
  <circle
     class="star"
     cx="1130"
     cy="230"
     r="1.3"
     id="circle20" />
  <circle
     class="star"
     cx="600"
     cy="260"
     r="1.3"
     id="circle21" />
  <!-- Montagnes : deux plans, silhouette douce type Écrins -->
  <path
     class="mtn2"
     d="M0,600 L0,470 L140,380 L260,450 L400,350 L540,440 L660,370 L820,460 L960,390 L1100,455 L1200,410 L1200,600 Z"
     id="path21" />
  <path
     class="mtn"
     d="M0,600 L0,520 L180,430 L320,500 L480,410 L640,495 L800,430 L950,505 L1100,450 L1200,490 L1200,600 Z"
     id="path22" />
</svg>
