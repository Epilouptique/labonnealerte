<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publier un événement — Institutions — La Bonne Alerte</title>
<meta name="description" content="Espace des collectivités : publiez une coupure d'eau, des travaux, un événement ou une fermeture pour informer les habitants de votre commune.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/institutions.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#fdfaff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)">
<style>
  .pub-wrap{width:100%;max-width:800px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
  .pub-progress{height:8px;border-radius:999px;background:var(--line,#e7e2ef);overflow:hidden;margin:8px 0 4px}
  .pub-progress > i{display:block;height:100%;background:var(--amber,#f2a900);transition:width .25s ease}
  .pub-stepinfo{font-size:.85rem;color:var(--muted,#6b6878);margin-bottom:18px}
  .pub-step{background:var(--surface,#fff);border-radius:24px;padding:22px;box-shadow:0 1px 3px rgba(30,20,50,.06);transition:box-shadow .2s ease}
  .pub-step h1{font-size:1.5rem;line-height:1.2;margin:.2em 0 .6em}
  .pub-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pub-card{display:flex;flex-direction:column;gap:3px;text-align:left;border:2px solid var(--line,#e7e2ef);border-radius:12px;padding:12px;background:var(--card,#fff);cursor:pointer;font:inherit}
  .pub-card[aria-pressed="true"]{border-color:var(--amber,#f2a900);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber,#f2a900) 25%,transparent)}
  .pub-card b{font-size:.95rem}
  .pub-card span{color:var(--muted,#6b6878);font-size:.78rem;line-height:1.3}
  @media (max-width:560px){.pub-cards{grid-template-columns:1fr}}
  .pub-field{display:block;margin:0 0 14px}
  .pub-field > span{display:block;font-weight:600;margin-bottom:6px}
  .pub-field input,.pub-field textarea,.pub-field select{width:100%;padding:12px;border:2px solid var(--line,#e7e2ef);border-radius:12px;font:inherit;background:var(--card,#fff);color:inherit;transition:border-color .18s ease,box-shadow .18s ease}
  .pub-field textarea{resize:vertical;min-height:120px}
  .pub-field input:focus,.pub-field textarea:focus,.pub-field select:focus,.pub-card:focus-visible,.pub-btn:focus-visible{outline:3px solid var(--amber,#f2a900);outline-offset:2px}
  .pub-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:560px){.pub-row{grid-template-columns:1fr}}
  .pub-hint{font-size:.85rem;color:var(--muted,#6b6878);margin:4px 0 0}
  .pub-err{color:#b00020;font-weight:600;margin:10px 0 0}
  .pub-ok{color:var(--green,#1a7f37);font-weight:600;margin:10px 0 0}
  .pub-preview{background:var(--bg-soft,#f6f3fb);border:1px solid var(--line,#e7e2ef);border-radius:12px;padding:16px;margin-top:8px}
  .pub-preview h3{margin:.1em 0 .3em;font-size:1.1rem}
  .pub-preview .meta{font-size:.82rem;color:var(--muted,#6b6878);margin-bottom:8px}
  .pub-preview .body{white-space:pre-wrap;line-height:1.5}
  .pub-detailblock{animation:pub-reveal .28s cubic-bezier(.2,.7,.2,1)}
  @keyframes pub-reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.pub-detailblock{animation:none}}
  .pub-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:22px;padding-bottom:env(safe-area-inset-bottom)}
  .pub-btn{min-width:160px;max-width:100%;padding:14px;border-radius:12px;border:0;font:inherit;font-weight:700;cursor:pointer;background:var(--amber,#f2a900);color:#1a1300}
  .pub-btn.ghost{margin-right:auto;background:transparent;border:2px solid var(--line,#e7e2ef);color:inherit}
  .pub-btn[disabled]{opacity:.5;cursor:not-allowed}
</style>
</head>
<body class="inst loading">
<header><div class="wrap nav"></div></header>

<main class="pub-wrap" id="mp-root" aria-live="polite">
  <noscript><p>Cette page nécessite JavaScript.</p></noscript>
</main>

<!--FOOTER-->
<script src="/js/theme.js"></script>
<script src="/js/session.js"></script>
<script src="/js/header.js"></script>
<script src="/js/institutions-publier.js"></script>
<script src="/js/pwa.js"></script>
</body>
</html>
