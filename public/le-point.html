<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Point — LaBonneAlerte</title>
<meta name="description" content="Que se passe-t-il en ce moment, et qu'arrive-t-il bientôt ? L'essentiel des alertes en cours et des événements à venir, en un coup d'œil.">
<meta property="og:title" content="Le Point — LaBonneAlerte">
<meta property="og:description" content="Les alertes en cours et les événements à venir, en un coup d'œil.">
<meta property="og:url" content="https://labonnealerte.fr/le-point">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/site.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#fdfaff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body class="loading">

<header>
  <!-- Header injecte par js/header.js (source unique). Ancre minimale. -->
  <div class="wrap nav"></div>
</header>

<!-- Halo de l'écran de chargement commun (visible tant que body.loading). -->
<div class="page-loading" role="status" aria-live="polite">Chargement…</div>

<main class="wrap lepoint-main">
  <div class="lepoint-head">
    <h1 class="page-title">Le <span class="hl">Point</span></h1>
    <p id="lp-generated" class="src-desc"></p>
    <button type="button" id="lp-share" class="notif-btn lp-share" hidden>Partager</button>
  </div>

  <div id="lp-loading" class="src-loading">Chargement…</div>

  <section id="lp-view" hidden>
    <div class="section-label">En ce moment</div>
    <div id="lp-active"></div>

    <div class="section-label lp-soon-label">À venir</div>
    <ul id="lp-upcoming" class="lp-upcoming"></ul>
  </section>

  <div id="lp-error" class="src-desc" hidden>Le Point est momentanément indisponible. Réessayez dans un instant.</div>
</main>

<script src="/js/page-loading.js"></script>
<script src="/js/session.js"></script>
<script src="/js/categories.js"></script>
<script src="/js/le-point.js"></script>
<script src="/js/hero-letters.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/header.js"></script>
<script src="/js/pwa.js"></script>
</body>
</html>
