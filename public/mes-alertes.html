<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes alertes — La Bonne Alerte</title>
<meta name="description" content="Gérez tous vos abonnements d'alerte sans compte : recevez un lien d'accès par email.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/site.css">
<style>
/* --- page « Mes alertes » --- */
.ma-main { padding: 56px 0 80px; }
.ma-head { text-align: center; margin-bottom: 32px; }
.ma-head h1 { font-size: clamp(28px, 4.5vw, 42px); font-weight: 800; letter-spacing: -0.02em; }
.ma-head p { color: var(--muted); font-size: 16px; margin-top: 10px; }
.ma-head .email { color: var(--ink); font-weight: 700; }

/* Vue « demande de lien » : carte centrée. */
.request-card {
  max-width: 440px; margin: 0 auto; background: var(--surface);
  border-radius: 24px; padding: 32px 28px; box-shadow: var(--shadow);
}
.request-card h1 { font-size: 24px; font-weight: 800; text-align: center; }
.request-card p.sub { color: var(--muted); font-size: 14.5px; text-align: center; margin: 10px 0 22px; }
.request-form { display: grid; gap: 12px; }
.request-form input {
  border: 1.5px solid color-mix(in srgb, var(--ink) 30%, transparent);
  background: transparent; border-radius: 999px; padding: 12px 18px;
  font: inherit; font-size: 15px; color: var(--ink);
}
.request-form button {
  border: none; background: var(--amber); color: #fff; font-weight: 700;
  font-size: 15px; border-radius: 999px; padding: 13px 0; cursor: pointer;
  box-shadow: 0 1px 3px rgba(30, 20, 50, .2); font-family: inherit;
}
.request-form button:hover { background: color-mix(in srgb, var(--amber) 88%, #000); }
.request-msg { text-align: center; font-size: 14px; font-weight: 600; margin-top: 16px; color: var(--green); }
.expired-banner {
  max-width: 440px; margin: 0 auto 18px; text-align: center;
  background: var(--amber-soft); color: var(--amber); font-weight: 600;
  border-radius: 12px; padding: 12px 16px; font-size: 14px;
}

/* Toggle switch on/off (état ON = vert, actif légitime). */
.switch-row { display: flex; align-items: center; gap: 12px; }
.switch { position: relative; display: inline-block; width: 46px; height: 26px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .track {
  position: absolute; inset: 0; border-radius: 999px; background: var(--line);
  border: 2px solid color-mix(in srgb, var(--muted) 45%, transparent); transition: background .2s, border-color .2s;
}
.switch .thumb {
  position: absolute; top: 4px; left: 4px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: transform .2s;
  border: 1px solid color-mix(in srgb, var(--muted) 45%, transparent);
}
.switch input:checked ~ .track { background: var(--green); border-color: transparent; }
.switch input:checked ~ .thumb { transform: translateX(20px); border-color: transparent; }
.switch input:focus-visible ~ .track { outline: 2px solid var(--amber); outline-offset: 2px; }
.switch-label { font-size: 13px; font-weight: 600; color: var(--muted); }
.switch-label.on { color: var(--green); }
.ma-error { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="/">labonne<span class="a">alerte</span><span class="bang"><span class="bar"></span><span class="dot"></span></span><span class="fr">fr</span></a>
    <nav class="nav-right">
      <a href="/">← Retour au kiosque</a>
      <button class="theme-btn" type="button" onclick="toggleTheme()" aria-label="Changer de thème">◐</button>
    </nav>
  </div>
</header>

<main class="wrap ma-main">

  <!-- Vue : demande de lien (sans token / token expiré) -->
  <section id="request-view" hidden>
    <div class="expired-banner" id="expired-banner" hidden>Lien expiré, redemandez un accès.</div>
    <div class="request-card">
      <h1>Gérer mes alertes</h1>
      <p class="sub">Entrez votre email : on vous envoie un lien d'accès pour gérer tous vos abonnements. Sans compte, sans mot de passe.</p>
      <form class="request-form" id="request-form">
        <input type="email" name="email" required placeholder="votre@email.fr" aria-label="Adresse email">
        <button type="submit" id="request-btn">Recevoir mon lien d'accès</button>
      </form>
      <div class="request-msg" id="request-msg" hidden></div>
    </div>
  </section>

  <!-- Vue : gestion (token valide) -->
  <section id="manage-view" hidden>
    <div class="ma-head">
      <h1>Mes alertes</h1>
      <p>Connecté en tant que <span class="email" id="ma-email"></span></p>
    </div>
    <div class="grid" id="ma-grid"></div>
  </section>

  <div class="ma-error" id="ma-loading">Chargement…</div>

</main>

<script src="/js/myalerts.js"></script>
</body>
</html>
